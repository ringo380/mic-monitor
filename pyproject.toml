[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mic-monitor"
version = "1.0.0"
description = "Hear your own microphone in your headphones with low latency, with a CLI and a tray icon."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Ryan Robson" }]
keywords = ["microphone", "monitoring", "audio", "headphones", "sidetone", "tray"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "sounddevice>=0.4.6",
    "numpy>=1.24",
    "pystray>=0.19",
    "Pillow>=9",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/robworks-code/mic-monitor"
Issues = "https://github.com/robworks-code/mic-monitor/issues"

[project.scripts]
mic-monitor = "mic_monitor.cli:main"

# A GUI script launches under pythonw on Windows, so the tray has no console.
[project.gui-scripts]
mic-monitor-tray = "mic_monitor.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mic_monitor"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
